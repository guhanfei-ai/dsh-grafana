# CI 工作流：每次向 main 分支推送或发起针对 main 的 PR 时，
# 在多个 Node.js 版本上执行校验、打包预演与安全审计。
name: CI

# 触发条件：
# - push 到 main 分支
# - 针对 main 分支的 pull_request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限原则：仅授予读取仓库内容的权限，避免工作流获得写权限令牌。
permissions:
  contents: read

jobs:
  # 校验任务：在矩阵中列出的每个 Node.js 版本上运行同一套校验。
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      # 即使某个版本失败也不中断其它版本，便于看全矩阵结果。
      fail-fast: false
      matrix:
        # 覆盖 README 中声明的兼容矩阵：Node 20 / 22 / 24。
        node: [20, 22, 24]
    steps:
      # 拉取源码。
      - uses: actions/checkout@v7
      # 安装指定版本的 Node，并缓存 npm 依赖以加速后续构建。
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # 按 lockfile 精准安装依赖，--ignore-scripts 跳过安装期脚本（含 prepack）以免误触发发布流程。
      - run: npm ci --ignore-scripts
      # 运行 package.json 中定义的 verify：语法 check + 单元测试。
      - run: npm run verify
      # 在不真正发布的情况下打包，验证 files 清单与打包完整性。
      - run: npm pack --dry-run --ignore-scripts
      # 仅审计生产依赖，且只报告 high 及以上级别的漏洞。
      - run: npm audit --omit=dev --audit-level=high
